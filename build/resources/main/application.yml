server:
  port: 8081

spring:
  application:
    name: simple-order-service
  datasource:
    url: jdbc:postgresql://localhost:5433/order_service
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

iam:
  auth-server-url: http://localhost:8080
  client-id: order-service
  client-secret: order-service-secret

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.joycai.orderservice: DEBUG
